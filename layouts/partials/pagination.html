<div style="margin-top: 3rem;">
{{ if .Paginator.HasPrev }}
  <a href="{{ .Paginator.Prev.URL }}">« </a>
{{ else }}
  <span class="link disabled">« </span>
{{ end }}
{{ .Paginator.PageNumber }} of {{ .Paginator.TotalPages }}
{{ if .Paginator.HasNext }}
  <a href="{{ .Paginator.Next.URL }}"> »</a>
{{ else }}
  <span class="link disabled"> »</span>
{{ end }}
</div>
