{{ define "main" }}
<main>
  {{ if or .Title .Content }}
  <div>
    {{ with .Title }}
    <div class="term-line">
      <span class="term-path">~/victor</span>
      <span class="term-prompt"> $</span> ls {{ . | lower }}/
    </div>
    {{ end }}
    {{ with .Content }}
    <div class="list-content">{{ . }}</div>
    {{ end }}
  </div>
  {{ end }}

  {{ range .Paginator.Pages }}
    {{ .Render "summary" }}
  {{ end }}

  {{ partial "pagination.html" . }}
</main>
{{ end }}
