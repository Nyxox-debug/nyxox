{{ define "main" }}
<main>
  <section class="search-page" data-baseurl="{{ .Site.BaseURL }}">
    <h1>Search</h1>
    <form id="search-form" action="{{ .Permalink }}" method="get">
      <label for="search-input" class="sr-only">Search</label>
      <input type="text" id="search-input" name="q" placeholder="Search posts..." autofocus>
      <button type="submit">Search</button>
    </form>
    <div id="search-results"></div>
  </section>
</main>
{{ end }}

{{ define "scripts" }}
<script src="https://unpkg.com/lunr/lunr.js"></script>
<script>
let searchIndex = null;
let posts = null;

async function loadIndex() {
  const searchSection = document.querySelector('.search-page');
  const baseURL = searchSection.dataset.baseurl;
  const response = await fetch(baseURL + 'index.json');
  posts = await response.json();
  
  searchIndex = lunr(function() {
    this.ref('url');
    this.field('title', { boost: 10 });
    this.field('content');
    this.field('tags');
    this.field('categories');
    
    posts.forEach(doc => {
      this.add(doc);
    });
  });
}

function displayResults(results) {
  const container = document.getElementById('search-results');
  
  if (!results.length) {
    container.innerHTML = '<p class="no-results">No results found.</p>';
    return;
  }
  
  let html = '<ul class="search-results-list">';
  
  results.forEach(result => {
    const post = posts.find(p => p.url === result.ref);
    if (post) {
      const date = new Date(post.date * 1000).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
      html += `<li>
        <a href="${post.url}"><h3>${post.title}</h3></a>
        <p class="search-meta">${date}</p>
      </li>`;
    }
  });
  
  html += '</ul>';
  container.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadIndex();
  
  const query = new URLSearchParams(window.location.search).get('q');
  const searchInput = document.getElementById('search-input');
  
  if (query && searchIndex) {
    searchInput.value = query;
    const results = searchIndex.search(query);
    displayResults(results);
  }
  
  const form = document.getElementById('search-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const query = document.getElementById('search-input').value;
    if (query && searchIndex) {
      const results = searchIndex.search(query);
      displayResults(results);
      window.history.pushState({}, '', `?q=${encodeURIComponent(query)}`);
    }
  });
});
</script>
{{ end }}
