        url = "/categories/"
        weight = 2 

  [[menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 3

  [[menu.main]]
        identifier = "notes"
        name = "Notes"
        url = "/notes/"
        weight = 4

  [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 5

  [[menu.main]]
        identifier = "portfolio"
        name = "Portfolio"
        url = "/portfolio/"
        weight = 6

