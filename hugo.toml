baseURL = "https://nyxox.dev/"
languageCode = "en-us"
locale = "en-US"
title = "Victor (nyxox)"
theme = "smol"

enableRobotsTXT = true
enableGitInfo = true
canonifyURLs = false
relativeURLs = false
summaryLength = 30

[params]
subtitle = "neural nets and chill"
description = "Portfolio and technical blog of Victor Chinekezi, covering backend engineering, systems programming, AI infrastructure, developer tooling, and software projects."
author = "Victor Chinekezi"
dateFmt = "2 Jan 2006"
profileImage = "KingSolomon.jpg"
mainSections = ["posts"]
customCSS = ["css/style.css"]

images = ["images/og-default.png"]

[params.icons]
throw_on_error = false

[pagination]
pagerSize = 10

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

[mediaTypes]
[mediaTypes."application/xml"]
suffixes = ["xml"]

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[outputFormats]
[outputFormats.RSS]
mediaType = "application/xml"
baseName = "index"
isPlainText = true

[outputFormats.JSON]
mediaType = "application/json"
baseName = "index"
isPlainText = true

[taxonomies]
category = "categories"
tag = "tags"

[menu]
[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 1

[[menu.main]]
identifier = "categories"
name = "Categories"
url = "/categories/"
weight = 2

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 3

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 4

[[menu.main]]
identifier = "portfolio"
name = "Portfolio"
url = "/portfolio/"
weight = 5

[[menu.footer]]
name = "GitHub"
url = "https://github.com/Nyxox-debug"
weight = 1

copyright = "© 2026 Victor Chinekezi"

[markup]
[markup.highlight]
noClasses = false
style = "bw"

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = false

[module]
[[module.imports]]
path = "github.com/hugomods/icons/vendors/bootstrap"

[[module.imports]]
path = "github.com/hugomods/icons/vendors/font-awesome"
