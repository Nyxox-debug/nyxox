baseURL = 'https://nyxox-debug.github.io/nyxox/'
languageCode = 'en-us'
title = 'Nyxox'

theme = 'smol'

# Parameters
[params]
    subtitle = "A Time for Every Purpose"
    dateFmt = "02.01.2006 15:04"
    [params.contact]
        email = 'info@example.org'
        phone = '+1 202-555-1212'
    [params.icons]
      throw_on_error = true # TODO: Remove this in prod

