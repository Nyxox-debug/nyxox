baseURL = 'https://nyxox-debug.github.io/nyxox/'
languageCode = 'en-us'
title = 'Victor'
theme = 'smol'

[params]
    subtitle = "neural nets and chill"
    description = "Software engineer portfolio and blog focused on systems programming, web development, and backend engineering."
    author = "Nyxox"
    dateFmt = "2 Jan 2006"
    profileImage = "KingSolomon.jpg"
    mainSections = ["posts"]
    customCSS = ["css/custom.css"]
    
[params.icons]
    throw_on_error = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[mediaTypes]
  [mediaTypes."application/xml"]
    suffixes = ["xml"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/xml"
    baseName = "index"
    isPlainText = true
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1 

  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 2 

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 4

  [[menu.main]]
    identifier = "portfolio"
    name = "Portfolio"
    url = "/portfolio/"
    weight = 5

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 6

# Footer
  [[menu.footer]]
        name = "Github"
        url = "https://github.com/Nyxox-debug"
        weight = 1 


copyright = "© 2026 Nyxox"

# Modules

[markup]
  [markup.highlight]
    noClasses = false
    style = "bw"

[module]
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/bootstrap'
  [[module.imports]]
    path = 'github.com/hugomods/icons/vendors/font-awesome'
