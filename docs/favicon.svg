  <line x1="6" y1="28" x2="6" y2="6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="6" x2="24" y2="6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="6" x2="18" y2="10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
